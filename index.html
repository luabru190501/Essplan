<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6a43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Essplan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<title>Unser Essplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column for the phone, three views behind a tab bar (Woche, Rezepte, Einkauf). */
:root {
  --bg: #f3f5f1;
  --surface: #ffffff;
  --ink: #1c231e;
  --muted: #5d6a61;
  --line: #dde3dc;
  --accent: #2f6a43;
  --accent-soft: #e2efe5;
  --deal: #b93a24;
  --deal-soft: #fbe9e4;
  --warn: #8a5a00;
  --warn-soft: #fdf1d8;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131815;
    --surface: #1c231f;
    --ink: #e8eee9;
    --muted: #9eaca3;
    --line: #2e3832;
    --accent: #79c08f;
    --accent-soft: #1f3327;
    --deal: #f08a72;
    --deal-soft: #3a211b;
    --warn: #f0c46a;
    --warn-soft: #362b14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131815;
  --surface: #1c231f;
  --ink: #e8eee9;
  --muted: #9eaca3;
  --line: #2e3832;
  --accent: #79c08f;
  --accent-soft: #1f3327;
  --deal: #f08a72;
  --deal-soft: #3a211b;
  --warn: #f0c46a;
  --warn-soft: #362b14;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.45;
}
.wrap { max-width: 640px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 30px; }
h2 { font-size: 22px; }
h3 { font-size: 19px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
small, .small { font-size: 14px; }

header { display: grid; gap: 10px; }
.sub { color: var(--muted); font-size: 15px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.stat b { display: block; font-family: var(--font-display); font-size: 22px; }
.stat span { color: var(--muted); font-size: 13px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.deal { background: var(--deal-soft); color: var(--deal); }
.sync { font-size: 13px; color: var(--muted); }

nav { position: sticky; top: env(safe-area-inset-top); z-index: 5; background: var(--bg); padding: 6px 0; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tabs button { border: 0; background: transparent; color: var(--ink); font: 600 16px var(--font-body); padding: 9px 4px; border-radius: 999px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--surface); }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.view { display: grid; gap: 12px; }
.view[hidden] { display: none; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 15px var(--font-body); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 8px; }
.day { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; }
.day-label { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--accent); padding-top: 8px; }
.day-body { display: grid; gap: 6px; min-width: 0; }
select { width: 100%; font: 600 17px var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 14px; color: var(--muted); align-items: center; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: 600 14px var(--font-body); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.note { border-radius: var(--radius); padding: 10px 14px; font-size: 15px; background: var(--warn-soft); color: var(--warn); }

details.recipe { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
details.recipe summary { list-style: none; cursor: pointer; padding: 14px; display: grid; gap: 4px; }
details.recipe summary::-webkit-details-marker { display: none; }
details.recipe summary .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
details.recipe summary .row::after { content: "Öffnen"; font-size: 14px; color: var(--accent); font-weight: 600; flex: none; }
details.recipe[open] summary .row::after { content: "Schliessen"; }
.recipe-body { padding: 0 14px 16px; display: grid; gap: 12px; }
.recipe-body ul { margin: 0; padding-left: 20px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--bg); cursor: pointer; }
.steps li::before { content: counter(s); font-family: var(--font-display); font-weight: 700; color: var(--accent); font-size: 18px; }
.steps li.done { opacity: .5; text-decoration: line-through; }
.primary { border: 0; background: var(--accent); color: var(--surface); font: 700 16px var(--font-body); padding: 11px 16px; border-radius: 999px; cursor: pointer; justify-self: start; }
.ghost { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 15px var(--font-body); padding: 9px 14px; border-radius: 999px; cursor: pointer; }

.progress { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); transition: width .2s; }
.shop-head { display: grid; gap: 8px; }
.shop-head .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.group { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.group h3 { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.group h3 span { font-family: var(--font-body); font-size: 15px; color: var(--muted); font-weight: 600; }
.item { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); align-items: start; cursor: pointer; }
.item:last-child { border-bottom: 0; }
.item input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent); cursor: pointer; }
.item .name { font-weight: 600; }
.item .info { font-size: 14px; color: var(--muted); }
.item .price { font-weight: 700; text-align: right; white-space: nowrap; }
.item .price s { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
.item.checked .name, .item.checked .info, .item.checked .price { opacity: .45; }
.item.checked .name { text-decoration: line-through; }
.tag-deal { display: inline-block; font-size: 12px; font-weight: 700; color: var(--deal); background: var(--deal-soft); border-radius: 6px; padding: 0 6px; margin-left: 6px; vertical-align: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.cook { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); gap: 16px; }
.cook[hidden] { display: none; }
.cook-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; max-width: 640px; width: 100%; margin: 0 auto; }
.cook-main { max-width: 640px; width: 100%; margin: 0 auto; display: grid; align-content: center; gap: 16px; overflow-y: auto; }
.cook-step { font-size: 24px; line-height: 1.4; }
.cook-count { font-family: var(--font-display); color: var(--accent); font-size: 18px; font-weight: 700; }
.cook-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 640px; width: 100%; margin: 0 auto; }
.cook-nav button { padding: 16px; font-size: 18px; justify-self: stretch; }
.footer { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 400px) { .stats { grid-template-columns: 1fr 1fr; } .stat:last-child { grid-column: span 2; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Unser Essplan</h1>
    <div class="sub" id="weekLabel"></div>
    <div class="stats">
      <div class="stat"><b class="num" id="statTotal">–</b><span>Einkauf total</span></div>
      <div class="stat"><b class="num" id="statPortion">–</b><span>pro Portion</span></div>
      <div class="stat"><b class="num" id="statSave">–</b><span>gespart mit Aktionen</span></div>
    </div>
    <div class="pills" id="pills"></div>
    <div class="sync" id="sync">Wird geladen …</div>
  </header>

  <nav>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-woche" data-view="woche" aria-selected="true">Woche</button>
      <button role="tab" id="tab-rezepte" data-view="rezepte" aria-selected="false">Rezepte</button>
      <button role="tab" id="tab-einkauf" data-view="einkauf" aria-selected="false">Einkauf</button>
    </div>
  </nav>

  <section class="view" id="view-woche" aria-labelledby="tab-woche"></section>
  <section class="view" id="view-rezepte" aria-labelledby="tab-rezepte" hidden></section>
  <section class="view" id="view-einkauf" aria-labelledby="tab-einkauf" hidden></section>

  <p class="footer" id="footer"></p>
</div>

<div class="cook" id="cook" hidden role="dialog" aria-modal="true" aria-labelledby="cookTitle">
  <div class="cook-top">
    <h2 id="cookTitle"></h2>
    <button class="ghost" id="cookClose">Schliessen</button>
  </div>
  <div class="cook-main">
    <div class="cook-count num" id="cookCount"></div>
    <div class="cook-step" id="cookStep"></div>
  </div>
  <div class="cook-nav">
    <button class="ghost" id="cookPrev">Zurück</button>
    <button class="primary" id="cookNext">Weiter</button>
  </div>
</div>

<script src="daten.js"></script>
<script src="app.js"></script>
</body>
</html>
