<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zuhause">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Unser Zuhause</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: App für das iPhone. Untere Tab-Leiste (Heute, Woche, Gerichte, Einkauf), Inhalte in einer Spalte,
   Rezepte und Auswahl als Blatt, das von unten hochfährt, Kochmodus im Vollbild. */
:root {
  --bg: #f6f3ec;
  --surface: #ffffff;
  --surface-2: #efebe1;
  --ink: #1d211c;
  --muted: #69705f;
  --line: #e3ddd0;
  --basil: #2f6b46;
  --basil-soft: #dcebdf;
  --tomato: #c8462c;
  --tomato-soft: #f8e1d9;
  --saffron: #e3a21a;
  --saffron-soft: #fbedc8;
  --ocean: #2d6b8a;
  --ocean-soft: #dceaf1;
  --on-color: #ffffff;
  --shadow: 0 1px 2px rgb(40 35 20 / .06), 0 8px 24px rgb(40 35 20 / .08);
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --r-lg: 24px;
  --r-md: 18px;
  --tabbar-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121512; --surface: #1b201b; --surface-2: #232923; --ink: #edf0ea; --muted: #a2aa9c; --line: #2d342c;
    --basil: #79c18f; --basil-soft: #1f3526; --tomato: #f08a6f; --tomato-soft: #3b231c; --saffron: #f0bd4f; --saffron-soft: #3a3019;
    --ocean: #7cb8d6; --ocean-soft: #1b2f39; --on-color: #ffffff; --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121512; --surface: #1b201b; --surface-2: #232923; --ink: #edf0ea; --muted: #a2aa9c; --line: #2d342c;
  --basil: #79c18f; --basil-soft: #1f3526; --tomato: #f08a6f; --tomato-soft: #3b231c; --saffron: #f0bd4f; --saffron-soft: #3a3019;
  --ocean: #7cb8d6; --ocean-soft: #1b2f39; --on-color: #ffffff; --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.45; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
button { font-family: var(--font-body); color: inherit; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.1; text-wrap: balance; }
h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 23px; font-weight: 800; letter-spacing: -0.01em; }
h3 { font-size: 18px; font-weight: 700; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
:focus-visible { outline: 3px solid var(--basil); outline-offset: 2px; }
[hidden] { display: none !important; }

main { overflow-x: hidden; grid-template-columns: minmax(0, 1fr); max-width: 640px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); display: grid; gap: 18px; }
.section { display: grid; gap: 10px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 16px; display: grid; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

/* Kopf */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-top: 6px; }
.sync { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync.on i { background: var(--basil); box-shadow: 0 0 0 3px var(--basil-soft); }
.sync.off i { background: var(--saffron); }

/* Gericht-Illustration */
.art { position: relative; overflow: hidden; display: grid; place-items: center; color: var(--on-color); }
.art svg.ico { width: 46%; height: 46%; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; position: relative; z-index: 1; filter: drop-shadow(0 2px 6px rgb(0 0 0 / .18)); }
.art .blob { position: absolute; border-radius: 50%; background: rgb(255 255 255 / .14); }
.art .b1 { width: 70%; aspect-ratio: 1; right: -18%; top: -30%; }
.art .b2 { width: 45%; aspect-ratio: 1; left: -12%; bottom: -20%; background: rgb(0 0 0 / .08); }
.art .b3 { width: 14%; aspect-ratio: 1; left: 18%; top: 16%; background: rgb(255 255 255 / .22); }
.art-tomato { background: linear-gradient(140deg, #d9573a, #a8331f); }
.art-basil { background: linear-gradient(140deg, #3f8a5a, #255a39); }
.art-saffron { background: linear-gradient(140deg, #eab03a, #c47e10); }
.art-ocean { background: linear-gradient(140deg, #3d86a8, #22536c); }
.art-plum { background: linear-gradient(140deg, #8a5a8f, #5e3a63); }
.art-special { background: var(--surface-2); color: var(--muted); }

/* Heute */
.hero { border-radius: 28px; overflow: hidden; box-shadow: var(--shadow); background: var(--surface); }
.hero .art { height: 200px; }
.hero .art svg.ico { width: 34%; height: 60%; }
.hero-body { padding: 16px 18px 18px; display: grid; gap: 12px; }
.hero-body h2 { font-size: 27px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.fact { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 0; border-radius: 999px; padding: 12px 18px; font-size: 16px; font-weight: 700; cursor: pointer; }
.btn.primary { background: var(--basil); color: var(--surface); }
.btn.soft { background: var(--surface-2); color: var(--ink); }
.btn.block { width: 100%; }
.lunch { display: flex; gap: 12px; align-items: center; background: var(--saffron-soft); border-radius: var(--r-md); padding: 12px 14px; }
.lunch svg { width: 30px; height: 30px; flex: none; stroke: var(--ink); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.banner { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; border-radius: var(--r-md); padding: 14px 16px; background: var(--ink); color: var(--bg); cursor: pointer; }
.banner .spark { width: 36px; height: 36px; border-radius: 12px; background: var(--saffron); display: grid; place-items: center; flex: none; color: #1d211c; font-weight: 800; }
.banner b { display: block; font-size: 16px; }
.banner span.go { margin-left: auto; font-size: 26px; }

.strip { display: grid; grid-auto-flow: column; grid-auto-columns: 92px; gap: 10px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.daychip { scroll-snap-align: start; border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: var(--r-md); padding: 0 0 10px; overflow: hidden; display: grid; gap: 6px; text-align: left; cursor: pointer; }
.daychip .art { height: 64px; }
.daychip .art svg.ico { width: 40%; height: 70%; }
.daychip b { font-family: var(--font-display); font-size: 15px; padding: 0 10px; }
.daychip span { font-size: 12.5px; line-height: 1.25; padding: 0 10px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.daychip.today { outline: 2.5px solid var(--tomato); }
.daychip.free .art { background: var(--surface-2); color: var(--muted); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { border: 0; text-align: left; background: var(--surface); box-shadow: var(--shadow); border-radius: var(--r-md); padding: 14px; display: grid; gap: 4px; cursor: pointer; }
.tile b { font-family: var(--font-display); font-size: 24px; }
.tile .spread > span:first-child { display: grid; }
.ring { width: 54px; height: 54px; }
.ring circle { fill: none; stroke-width: 7; }
.ring .bg { stroke: var(--surface-2); }
.ring .fg { stroke: var(--basil); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .4s; }

/* Wochenwahl */
.weekbar { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.weekbar::-webkit-scrollbar { display: none; }
.wk { flex: none; border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 16px; padding: 8px 14px; text-align: left; cursor: pointer; display: grid; gap: 0; }
.wk b { font-family: var(--font-display); font-size: 16px; }
.wk span { font-size: 12px; color: var(--muted); font-weight: 600; }
.wk[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.wk[aria-pressed="true"] span { color: color-mix(in srgb, var(--bg) 75%, transparent); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); box-shadow: var(--shadow); border-radius: 16px; padding: 10px 12px; display: grid; }
.stat b { font-family: var(--font-display); font-size: 17px; white-space: nowrap; }
.stat span { color: var(--muted); font-size: 12.5px; font-weight: 600; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--basil-soft); color: var(--basil); }
.badge.warn { background: var(--saffron-soft); color: var(--ink); }
.note { border-radius: 14px; padding: 10px 14px; font-size: 15px; background: var(--saffron-soft); }

/* Lust */
.moods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mood { border: 1.5px solid transparent; background: var(--surface-2); border-radius: 16px; padding: 12px 6px 10px; display: grid; justify-items: center; gap: 6px; cursor: pointer; font-weight: 700; font-size: 13.5px; text-align: center; line-height: 1.15; transition: transform .15s; }
.mood svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mood[aria-pressed="true"] { border-color: var(--basil); background: var(--basil-soft); color: var(--basil); }
.mood:active { transform: scale(.96); }
.toast { font-size: 15px; color: var(--basil); font-weight: 700; min-height: 1.2em; }

/* Tage */
.days { display: grid; gap: 10px; }
.day { display: grid; grid-template-columns: 48px 64px 1fr; gap: 12px; align-items: center; background: var(--surface); box-shadow: var(--shadow); border-radius: var(--r-md); padding: 10px 12px 10px 10px; }
.day .date { text-align: center; display: grid; }
.day .date b { font-family: var(--font-display); font-size: 18px; }
.day .date span { font-size: 12px; color: var(--muted); font-weight: 600; }
.day.today .date b { color: var(--tomato); }
.day .art { width: 64px; height: 64px; border-radius: 16px; }
.day .art svg.ico { width: 60%; height: 60%; }
.day .info { min-width: 0; display: grid; gap: 4px; }
.day .info button.name { border: 0; background: none; padding: 0; text-align: left; font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 1.2; cursor: pointer; }
.day .meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.day .swap { justify-self: start; border: 0; background: var(--surface-2); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
.day.free .art { background: var(--surface-2); color: var(--muted); }

/* Gerichte */
.search { width: 100%; border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 14px; padding: 12px 14px; font: 600 16px var(--font-body); color: var(--ink); }
.chips { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dish { border: 0; padding: 0; text-align: left; background: var(--surface); box-shadow: var(--shadow); border-radius: var(--r-md); overflow: hidden; display: grid; align-content: start; cursor: pointer; position: relative; }
.dish .art { height: 104px; }
.dish .art svg.ico { width: 40%; height: 70%; }
.dish .txt { padding: 10px 12px 12px; display: grid; gap: 4px; }
.dish .txt b { font-family: var(--font-display); font-size: 15.5px; line-height: 1.2; }
.dish .txt span { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.dish .inplan { position: absolute; top: 8px; left: 8px; background: var(--surface); color: var(--ink); font-size: 12px; font-weight: 800; border-radius: 999px; padding: 2px 9px; z-index: 2; }

/* Einkauf */
.shop-head { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.shop-head .ring { width: 72px; height: 72px; }
.group { background: var(--surface); box-shadow: var(--shadow); border-radius: var(--r-md); overflow: hidden; }
.group h3 { padding: 13px 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--line); }
.group h3 span { font-family: var(--font-body); font-size: 14px; color: var(--muted); font-weight: 700; }
.item { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); align-items: start; cursor: pointer; }
.item:last-child { border-bottom: 0; }
.item input { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; margin: 1px 0 0; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; cursor: pointer; background: var(--surface); }
.item input:checked { background: var(--basil); border-color: var(--basil); }
.item input:checked::after { content: ""; width: 7px; height: 12px; border: solid var(--surface); border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.item .name { font-weight: 700; }
.item .info { font-size: 13.5px; color: var(--muted); }
.item .price { font-weight: 800; text-align: right; white-space: nowrap; }
.item .price s { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); }
.item.checked .name, .item.checked .info, .item.checked .price { opacity: .4; }
.item.checked .name { text-decoration: line-through; }
.deal { display: inline-block; font-size: 11.5px; font-weight: 800; color: var(--tomato); background: var(--tomato-soft); border-radius: 6px; padding: 0 6px; margin-left: 6px; vertical-align: 2px; }
.switch { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; cursor: pointer; }
.switch input { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .2s; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .2s; }
.switch input:checked { background: var(--basil); }
.switch input:checked::after { transform: translateX(18px); }

/* Tab-Leiste */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.6) blur(18px); -webkit-backdrop-filter: saturate(1.6) blur(18px); border-top: 1px solid var(--line); padding: 6px calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left)); }
.tabbar .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabbar button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 11.5px; font-weight: 700; color: var(--muted); cursor: pointer; position: relative; }
.tabbar svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { color: var(--basil); }
.tabbar .count { position: absolute; top: 2px; left: calc(50% + 8px); background: var(--tomato); color: #fff; font-size: 10.5px; border-radius: 999px; padding: 0 6px; line-height: 17px; }

/* Blatt (Rezept, Auswahl) */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgb(0 0 0 / .4); opacity: 0; transition: opacity .25s; }
.scrim.show { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-height: calc(100% - 44px - env(safe-area-inset-top)); background: var(--bg); border-radius: 28px 28px 0 0; overflow-y: auto; transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); max-width: 680px; margin: 0 auto; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
.sheet.show { transform: translateY(0); }
.sheet .grab { position: sticky; top: 0; z-index: 3; display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; }
.sheet .grab .handle { width: 40px; height: 5px; border-radius: 999px; background: rgb(255 255 255 / .7); position: absolute; left: 50%; top: 8px; transform: translateX(-50%); }
.close { border: 0; width: 36px; height: 36px; border-radius: 50%; background: rgb(0 0 0 / .35); color: #fff; font-size: 20px; line-height: 1; cursor: pointer; margin-left: auto; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.sheet .art.head { height: 210px; margin-top: -56px; }
.sheet .art.head svg.ico { width: 30%; height: 56%; }
.sheet .content { padding: 18px 18px 8px; display: grid; gap: 16px; }
.sheet.plain .grab .handle { background: var(--line); }
.sheet.plain .close { background: var(--surface-2); color: var(--ink); }
.factgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.factgrid div { background: var(--surface); box-shadow: var(--shadow); border-radius: 14px; padding: 8px 6px; text-align: center; display: grid; }
.factgrid b { font-family: var(--font-display); font-size: 17px; }
.factgrid span { font-size: 11.5px; color: var(--muted); font-weight: 700; }
.daypick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.daypick button { border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 12px; padding: 8px 0; font-weight: 800; font-size: 14px; cursor: pointer; }
.daypick button[aria-pressed="true"] { background: var(--basil); color: var(--surface); }
.ing { list-style: none; margin: 0; padding: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: var(--r-md); overflow: hidden; }
.ing li { padding: 11px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; cursor: pointer; }
.ing li:last-child { border-bottom: 0; }
.ing li::before { content: ""; width: 18px; height: 18px; flex: none; border-radius: 50%; border: 2px solid var(--line); }
.ing li.done { color: var(--muted); text-decoration: line-through; }
.ing li.done::before { background: var(--basil); border-color: var(--basil); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 10px; background: var(--surface); box-shadow: var(--shadow); border-radius: 16px; padding: 12px 14px 12px 10px; }
.steps li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--basil-soft); color: var(--basil); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; }
.src { color: var(--basil); font-weight: 700; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; }
.sticky-cta { position: sticky; bottom: 0; padding: 12px 18px 4px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
.pick-list { display: grid; gap: 8px; }
.pick { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 16px; padding: 8px 12px 8px 8px; text-align: left; cursor: pointer; width: 100%; }
.pick .art { width: 52px; height: 52px; border-radius: 12px; }
.pick .art svg.ico { width: 62%; height: 62%; }
.pick b { font-family: var(--font-display); font-size: 15.5px; line-height: 1.2; display: block; }
.pick span { font-size: 12.5px; color: var(--muted); font-weight: 600; }

/* Kochmodus */
.cook { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: grid; grid-template-rows: auto auto 1fr auto; gap: 16px; padding: calc(14px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom)); }
.cook > * { max-width: 640px; width: 100%; margin: 0 auto; }
.cook-top { display: flex; align-items: center; gap: 10px; }

.segs { display: flex; gap: 4px; }

.segs i.on { background: var(--basil); }
.cook-main { display: grid; align-content: center; gap: 18px; overflow-y: auto; }
.cook-num { font-family: var(--font-display); font-size: 64px; font-weight: 800; color: var(--basil); line-height: 1; }
.cook-step { font-size: 26px; line-height: 1.4; font-weight: 600; }
.timer { display: inline-flex; align-items: center; gap: 10px; border: 0; background: var(--saffron-soft); border-radius: 999px; padding: 10px 18px; font-size: 18px; font-weight: 800; cursor: pointer; justify-self: start; }
.timer.run { background: var(--saffron); color: #1d211c; }
.timer svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
.cook-nav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.cook-nav .btn { padding: 18px; font-size: 18px; }
.cook-ing { font-size: 15px; }
.cook-ing summary { cursor: pointer; font-weight: 700; color: var(--basil); }

.footer { font-size: 12.5px; color: var(--muted); text-align: center; }
/* Startseite */
.home-hero { position: relative; margin: calc(-12px - env(safe-area-inset-top)) -16px 0; height: calc(430px + env(safe-area-inset-top)); overflow: hidden; border-radius: 0 0 34px 34px; box-shadow: var(--shadow); }
.home-hero .scene { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.home-shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgb(0 0 0 / 0) 52%, rgb(0 0 0 / .5)); }
.home-txt { position: absolute; left: 20px; right: 20px; bottom: 22px; color: #fff; display: grid; gap: 6px; text-shadow: 0 2px 12px rgb(0 0 0 / .35); }
.home-txt .eyebrow { color: rgb(255 255 255 / .85); }
.home-txt h1 { font-size: 38px; line-height: 1.02; }
.home-txt p { font-size: 17px; font-weight: 600; opacity: .95; }
.home-sync { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 16px; }
.areas { display: grid; gap: 12px; margin-top: 4px; }
.area { display: grid; grid-template-columns: 58px minmax(0, 1fr) 20px; gap: 14px; align-items: center; width: 100%; text-align: left; border: 0; border-radius: 24px; padding: 16px 16px 16px 14px; cursor: pointer; box-shadow: var(--shadow); background: var(--surface); transition: transform .15s; }
.area:active { transform: scale(.98); }
.area-ico { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; color: #fff; }
.area-ico svg { width: 30px; height: 30px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.area-essen .area-ico { background: linear-gradient(140deg, #d9573a, #a8331f); }
.area-haushalt .area-ico { background: linear-gradient(140deg, #3f8a5a, #255a39); }
.area-kalender .area-ico { background: linear-gradient(140deg, #3d86a8, #22536c); }
.area-txt { display: grid; gap: 2px; min-width: 0; }
.area-txt b { font-family: var(--font-display); font-size: 18px; line-height: 1.2; }
.area-txt > span:last-child { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.area-go { font-size: 28px; color: var(--muted); }
.photo-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.photo-row label.chip { cursor: pointer; }
/* Register im Bereich Essen */
.seg { position: sticky; top: env(safe-area-inset-top); z-index: 6; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; margin: 0 -4px; background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 999px; box-shadow: var(--shadow); }
.seg button { border: 0; background: none; border-radius: 999px; padding: 8px 2px; font-weight: 700; font-size: 14.5px; cursor: pointer; position: relative; }
.seg button[aria-current="page"] { background: var(--basil); color: var(--surface); }
.seg .count { margin-left: 4px; background: var(--tomato); color: #fff; font-size: 11px; border-radius: 999px; padding: 0 6px; line-height: 16px; display: inline-block; vertical-align: 1px; }
/* Kalender */
.cal { background: var(--surface); box-shadow: var(--shadow); border-radius: var(--r-lg); padding: 12px 10px 10px; display: grid; gap: 6px; }
.cal-head, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; }
.cal-head span { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.kday { border: 0; background: none; border-radius: 14px; height: 52px; width: 100%; min-width: 0; display: grid; grid-template-rows: 1fr auto; justify-items: center; align-items: center; padding: 4px 0 6px; cursor: pointer; font-weight: 700; font-size: 16px; }
.kday .dots { display: flex; gap: 3px; min-height: 6px; }
.kday .dots i, .legend i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
i.out { background: none !important; border: 1.5px solid var(--basil); box-sizing: border-box; }
.kday.other { color: var(--muted); opacity: .45; }

.kday.sel { background: var(--ink); color: var(--bg); }
.kday.sel.today .n { outline-color: var(--bg); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 4px 6px 0; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.kev { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 16px; padding: 12px 14px; cursor: pointer; border-left: 5px solid var(--c); }
.card .kev { box-shadow: none; background: var(--surface-2); }
.ktime { font-size: 13px; color: var(--muted); font-weight: 700; }
.ktime b { color: var(--ink); }
.ktxt b { font-family: var(--font-display); font-size: 16.5px; }
.kwho { display: flex; gap: 2px; }
.kempty { width: 100%; border: 2px dashed var(--line); background: none; border-radius: 16px; padding: 16px; color: var(--muted); font-size: 15px; cursor: pointer; }
.kempty b { color: var(--basil); }
.kinfo { display: grid; gap: 8px; }
.krow { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; text-align: left; border: 0; background: var(--surface-2); border-radius: 14px; padding: 8px 12px 8px 8px; cursor: pointer; }
.kico .art { width: 44px; height: 44px; border-radius: 12px; }
.kico .art svg.ico { width: 62%; height: 62%; }
.kform { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.kform label { display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
.kform input { border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 12px; padding: 10px; font: 600 15px var(--font-body); color: var(--ink); min-width: 0; }
textarea.search { resize: vertical; font-family: var(--font-body); }
.floattoast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--tabbar-h) + 20px + env(safe-area-inset-bottom)); z-index: 50; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 12px 16px; font-weight: 600; box-shadow: var(--shadow); max-width: 600px; margin: 0 auto; }
.avatar { display: inline-grid; place-items: center; border-radius: 50%; color: #fff; font-weight: 800; font-family: var(--font-display); flex: none; vertical-align: middle; }
.hhero { display: flex; justify-content: space-between; align-items: center; gap: 14px; background: var(--ink); color: var(--bg); border-radius: 24px; padding: 18px; }
.hhero h2 { font-size: 23px; margin: 4px 0; }
.plist { display: grid; gap: 10px; }
.ptask { display: grid; grid-template-columns: 52px 1fr 44px; gap: 12px; align-items: center; background: var(--surface); box-shadow: var(--shadow); border-radius: var(--r-md); padding: 10px 12px 10px 10px; }
.ptask .art { width: 52px; height: 52px; border-radius: 14px; }
.ptask .art svg.ico { width: 62%; height: 62%; }
.ptask.mine { outline: 2px solid var(--basil); }
.ptask.done { opacity: .55; }
.ptask.done b { text-decoration: line-through; }
.pinfo { display: grid; gap: 3px; min-width: 0; }
.pinfo b { font-family: var(--font-display); font-size: 16px; line-height: 1.2; }
.pinfo .meta, .pinfo .who { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.late { color: var(--tomato); font-weight: 700; }
.linkish { border: 0; background: none; padding: 0; color: var(--basil); font-weight: 700; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.pcheck { width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; transition: transform .15s; }
.pcheck:active { transform: scale(.9); }
.pcheck.on { background: var(--basil); border-color: var(--basil); }
.pcheck.on::after { content: ""; width: 10px; height: 18px; border: solid var(--surface); border-width: 0 3px 3px 0; transform: translateY(-2px) rotate(45deg); }
.pdone summary { cursor: pointer; font-weight: 700; color: var(--muted); padding: 6px 2px; }
.pday { display: grid; gap: 2px; background: var(--surface); box-shadow: var(--shadow); border-radius: 14px; padding: 10px 14px; }
.pday span { font-size: 14px; color: var(--muted); }
.fair { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; }
.fair .bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.fair .bar i { display: block; height: 100%; border-radius: 999px; }
.pset { display: grid; gap: 8px; background: var(--surface); box-shadow: var(--shadow); border-radius: 14px; padding: 10px 12px; }
.pset.off { opacity: .55; }
.pset select, .card select { border: 0; background: var(--surface-2); border-radius: 10px; padding: 8px 10px; font: 600 14px var(--font-body); color: var(--ink); }
.subhead { padding: 8px 16px 6px; font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
.havebtn { display: block; margin: 6px 0 0 auto; border: 0; background: var(--surface-2); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.haveitem { cursor: default; }
.haveitem .name, .haveitem .info { opacity: .6; }
.porbadge { background: var(--saffron-soft); color: var(--ink); border-radius: 999px; padding: 0 8px; font-weight: 700; }
.stepper { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--surface); box-shadow: var(--shadow); border-radius: var(--r-md); padding: 12px 14px; }
.stepper button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: 22px; font-weight: 700; cursor: pointer; }
.stepper b.num { font-family: var(--font-display); font-size: 22px; min-width: 28px; text-align: center; }
.remind { background: var(--tomato-soft); box-shadow: none; }
.rem { display: flex; gap: 12px; align-items: flex-start; }
.rem .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tomato); margin-top: 7px; flex: none; }
.speak { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--surface-2); border-radius: 999px; padding: 8px 12px; font-weight: 700; font-size: 14px; cursor: pointer; }
.speak svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.speak[aria-pressed="true"] { background: var(--basil); color: var(--surface); }
.empty { text-align: center; padding: 30px 10px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
@media (max-width: 370px) { .moods { grid-template-columns: repeat(2, 1fr); } .factgrid { grid-template-columns: repeat(2, 1fr); } h1 { font-size: 30px; } }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }

/* ===== Stil «Ruhig und edel»: Hafer, Salbei, Ton, Nebelblau. Feine Linien statt Schatten, Serifen-Überschriften. ===== */
:root {
  --bg: #f4f0e8;
  --surface: #fbf9f4;
  --surface-2: #ece6da;
  --ink: #2c2a25;
  --muted: #857e72;
  --line: #e1d9cb;
  --basil: #5f7a62;
  --basil-soft: #e3e8de;
  --tomato: #a8684e;
  --tomato-soft: #f1e3da;
  --saffron: #b89a62;
  --saffron-soft: #f2ead9;
  --ocean: #6a8496;
  --ocean-soft: #e1e7ea;
  --on-color: #2c2a25;
  --shadow: none;
  --font-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --font-body: "Hanken Grotesk", "Helvetica Neue", system-ui, sans-serif;
  --r-lg: 22px;
  --r-md: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1916; --surface: #211f1b; --surface-2: #2a2723; --ink: #ece6da; --muted: #a39a8b; --line: #36322b;
    --basil: #9fb59f; --basil-soft: #27302a; --tomato: #d39a80; --tomato-soft: #352720; --saffron: #d4b77f; --saffron-soft: #332c1f;
    --ocean: #9fb4c3; --ocean-soft: #232c31; --on-color: #ece6da;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1916; --surface: #211f1b; --surface-2: #2a2723; --ink: #ece6da; --muted: #a39a8b; --line: #36322b;
  --basil: #9fb59f; --basil-soft: #27302a; --tomato: #d39a80; --tomato-soft: #352720; --saffron: #d4b77f; --saffron-soft: #332c1f;
  --ocean: #9fb4c3; --ocean-soft: #232c31; --on-color: #ece6da;
}
body { font-size: 16.5px; letter-spacing: .005em; }
h1, h2, h3 { font-weight: 400; letter-spacing: -0.005em; }
h1 { font-size: 40px; line-height: 1.02; font-weight: 400; }
h2 { font-size: 27px; font-weight: 400; }
h3 { font-size: 21px; font-weight: 400; }
.eyebrow { font-size: 13px; font-weight: 500; letter-spacing: .02em; text-transform: none; color: var(--muted); font-style: normal; }
main { gap: 22px; }

/* Flächen: keine Schatten, feine Linien */
.card, .hero, .tile, .stat, .day, .dish, .group, .daychip, .pick, .ptask, .pday, .pset, .kev, .cal, .area, .stepper, .factgrid div, .steps li, .ing, .weekbar .wk, .chip, .search, .sync, .daypick button, .kform input {
  box-shadow: none !important;
}
.card, .tile, .stat, .day, .dish, .group, .pick, .ptask, .pday, .pset, .kev, .cal, .stepper, .ing, .steps li, .factgrid div, .daychip { background: var(--surface); border: 1px solid var(--line); }
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.hero .art { height: 170px; }
.hero-body h2, .sheet h2 { font-size: 32px; line-height: 1.05; }
.fact, .badge, .porbadge { background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
.badge { color: var(--ink); }
.btn { font-weight: 600; letter-spacing: .01em; }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.soft { background: transparent; border: 1px solid var(--ink); color: var(--ink); }
.chip { background: transparent; border: 1px solid var(--line); font-weight: 500; }
.chip[aria-pressed="true"], .wk[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.weekbar .wk { background: transparent; border: 1px solid var(--line); }
.weekbar .wk b, .stat b, .tile b, .factgrid b { font-family: var(--font-display); font-weight: 400; }
.stat b { font-size: 20px; }
.tile b { font-size: 28px; }
.search { background: var(--surface); border: 1px solid var(--line); font-weight: 500; }
.sync { background: color-mix(in srgb, var(--surface) 85%, transparent); border: 1px solid var(--line); font-weight: 500; }
.sync.on i { box-shadow: none; }

/* Illustrationen: ruhige Tonflächen statt Verläufe */
.art { color: var(--ink); }
.art .blob { display: none; }
.art svg.ico { stroke-width: 1.3; filter: none; opacity: .85; }
.art-tomato { background: #ead8cc; }
.art-basil { background: #dde3d6; }
.art-saffron { background: #ece0c8; }
.art-ocean { background: #d9e1e5; }
.art-plum { background: #e3d9dc; }
.art-special { background: var(--surface-2); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .art-tomato { background: #3a2c25; } :root:not([data-theme="light"]) .art-basil { background: #2b332b; } :root:not([data-theme="light"]) .art-saffron { background: #37301f; } :root:not([data-theme="light"]) .art-ocean { background: #263036; } :root:not([data-theme="light"]) .art-plum { background: #352c30; } }

/* Startseite */
.home-hero { border-radius: 0 0 28px 28px; box-shadow: none; }
.home-shade { background: linear-gradient(to bottom, rgb(30 28 24 / 0) 50%, rgb(30 28 24 / .45)); }
.home-txt { text-shadow: none; }
.home-txt h1 { font-size: 46px; line-height: .98; font-weight: 400; }
.home-txt .eyebrow { color: rgb(255 255 255 / .85); }
.home-txt p { font-weight: 500; font-size: 16px; }
.areas { gap: 0; border-top: 1px solid var(--line); }
.area { background: transparent !important; border: 0 !important; border-bottom: 1px solid var(--line) !important; border-radius: 0; padding: 18px 2px; grid-template-columns: 44px minmax(0, 1fr) 16px; }
.area-ico { width: 44px; height: 44px; border-radius: 50%; background: transparent !important; border: 1px solid var(--line); color: var(--ink); }
.area-ico svg { width: 22px; height: 22px; stroke-width: 1.4; }
.area-txt b { font-size: 22px; font-weight: 400; }
.area-txt .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; }
.area-go { font-size: 22px; font-weight: 300; }

/* Navigation */
.tabbar { background: color-mix(in srgb, var(--bg) 94%, transparent); border-top: 1px solid var(--line); }
.tabbar button { font-weight: 500; font-size: 11px; letter-spacing: .02em; }
.tabbar svg { stroke-width: 1.4; width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--ink); }
.tabbar button[aria-current="page"]::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--ink); margin-top: 1px; }
.tabbar .count, .seg .count { background: var(--tomato); }
.seg { background: color-mix(in srgb, var(--bg) 94%, transparent); box-shadow: none; border-radius: 0; margin: 0 -16px; padding: 0 16px; border-bottom: 1px solid var(--line); gap: 0; }
.seg button { border-radius: 0; padding: 12px 2px 10px; font-weight: 500; font-size: 15px; color: var(--muted); border-bottom: 1.5px solid transparent; }
.seg button[aria-current="page"] { background: none; color: var(--ink); border-bottom-color: var(--ink); }

/* Listen */
.day { grid-template-columns: 44px 54px minmax(0, 1fr); }
.day .art { width: 54px; height: 54px; border-radius: 12px; }
.day .date b { font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.day.today .date b { color: var(--tomato); }
.day .info button.name, .pinfo b, .ktxt b, .pick b, .dish .txt b { font-family: var(--font-display); font-weight: 400; font-size: 19px; line-height: 1.15; }
.day .swap, .havebtn { background: transparent; border: 1px solid var(--line); font-weight: 500; }
.dish .art { height: 96px; }
.daychip .art { height: 58px; }
.daychip b { font-family: var(--font-display); font-weight: 400; font-size: 17px; }
.daychip.today { outline: 1.5px solid var(--tomato); }
.mood { background: transparent; border: 1px solid var(--line); font-weight: 500; }
.mood svg { stroke-width: 1.4; }
.mood[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.subhead { background: transparent; border-bottom: 1px solid var(--line); font-weight: 600; letter-spacing: .1em; font-size: 11px; }
.group h3 { font-size: 22px; }
.item .name { font-weight: 500; }
.item .price { font-weight: 600; }
.item input { border-width: 1.5px; }
.deal { background: transparent; border: 1px solid var(--tomato); color: var(--tomato); font-weight: 600; }
.remind { background: var(--tomato-soft); border-color: transparent; }
.lunch { background: var(--saffron-soft); }
.banner { background: var(--ink); }
.banner .spark { background: var(--bg); color: var(--ink); font-family: var(--font-display); font-weight: 400; font-size: 18px; }
.steps li::before { background: transparent; border: 1px solid var(--line); color: var(--ink); font-family: var(--font-display); font-weight: 400; }
.cook-num { font-family: var(--font-display); font-weight: 400; color: var(--ink); }
.cook-step { font-weight: 400; font-size: 25px; }
.timer { background: transparent; border: 1px solid var(--ink); font-weight: 600; }
.timer.run { background: var(--ink); color: var(--bg); }
.speak { background: transparent; border: 1px solid var(--line); font-weight: 500; }
.speak[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.pcheck { border-width: 1.5px; }
.pcheck.on, .item input:checked, .daypick button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); }
.ptask.mine { outline: 1.5px solid var(--ink); }
.hhero { background: var(--surface-2); color: var(--ink); }
.hhero h2 { font-size: 30px; }
.fair .bar { height: 6px; }
.kday.sel { background: var(--ink); color: var(--bg); }
.kday .n { font-family: var(--font-display); font-weight: 400; font-size: 19px; }
.kday.today .n { outline: 1px solid var(--tomato); }
.kempty { border: 1px dashed var(--line); }
.krow { background: var(--surface-2); }
.home-sync .sync { background: rgb(255 255 255 / .75); }
.ring .fg { stroke: var(--ink); stroke-width: 4; }
.ring circle { stroke-width: 4; }
.avatar { font-family: var(--font-body); font-weight: 600; }

/* Haushalt-Register, Ausgaben, Umzug, eigene Artikel */
.seg3 { grid-template-columns: repeat(3, 1fr); }
.saldo { display: grid; gap: 8px; padding: 22px 20px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); }
.saldo h2 { font-size: 30px; }
.saldo .big { font-family: var(--font-display); font-size: 46px; line-height: 1; }
.saldo .btn { justify-self: start; }
.xlist { border-top: 1px solid var(--line); }
.xrow { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 2px; cursor: pointer; }
.xrow b { font-family: var(--font-display); font-weight: 400; font-size: 19px; }
.xrow .xdate { font-size: 13px; color: var(--muted); }
.xrow .num { text-align: right; font-weight: 600; }
.catbars { display: grid; gap: 8px; }
.catbars .fair { grid-template-columns: 130px 1fr auto; }
.addx .row { flex-wrap: wrap; }
.favs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.fav { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.fav button { border: 0; background: none; padding: 6px 4px 6px 12px; font: 500 14px var(--font-body); color: var(--ink); cursor: pointer; }
.fav .favdel { padding: 6px 10px 6px 4px; color: var(--muted); }
.fav.on { background: var(--ink); border-color: var(--ink); }
.fav.on button { color: var(--bg); }
.uitem { cursor: default; grid-template-columns: 26px minmax(0, 1fr) auto; }
.uitem .name { line-height: 1.35; }
.whochip { border: 0; background: none; cursor: pointer; display: inline-flex; gap: 2px; padding: 0; }
.nobody { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 2px 8px; }
.late { color: var(--tomato); font-weight: 600; }

/* Mengen pro Schritt */
.stepings { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.stepings span { font-size: 13.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink); }
.cook-ing-step { display: grid; gap: 8px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.cing { font-size: 20px; font-family: var(--font-display); line-height: 1.25; }
.cing::before { content: "· "; color: var(--muted); }
</style>
</head>
<body>
<main id="view"></main>

<nav class="tabbar" aria-label="Bereiche">
  <div class="in">
    <button data-tab="start"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Zuhause</button>
    <button data-tab="essen"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><circle cx="12" cy="13" r="3.5"/><path d="M3 3v6M5 3v6M4 9v12M20 3c-1.5 1-2 3-2 6h2v12"/></svg>Essen</button>
    <button data-tab="haushalt"><svg viewBox="0 0 24 24"><path d="M14 3l-4 9"/><path d="M6 12h8l2 9H4z"/><path d="M8 16v5M11 16v5"/><path d="M18 4l.6 1.4L20 6l-1.4.6L18 8l-.6-1.4L16 6l1.4-.6z"/></svg>Haushalt<span class="count num" id="tabCountHaushalt" hidden></span></button>
    <button data-tab="kalender"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="8" cy="14.5" r="1"/><circle cx="12" cy="14.5" r="1"/><circle cx="16" cy="14.5" r="1"/></svg>Kalender<span class="count num" id="tabCountKalender" hidden></span></button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Details"></section>

<div class="cook" id="cook" hidden role="dialog" aria-modal="true" aria-labelledby="cookTitle">
  <div class="cook-top"><h2 id="cookTitle"></h2><button class="speak" id="cookSpeak" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg><span id="cookSpeakTxt">Vorlesen</span></button><button class="close" id="cookClose" aria-label="Kochmodus schliessen">×</button></div>
  <div class="segs" id="cookSegs" aria-hidden="true"></div>
  <div class="cook-main">
    <div class="cook-num num" id="cookNum"></div>
    <div class="cook-step" id="cookStep"></div>
    <div class="cook-ing-step" id="cookStepIng" hidden></div>
    <button class="timer" id="cookTimer" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span id="cookTimerTxt"></span></button>
    <details class="cook-ing"><summary>Zutaten anzeigen</summary><ul id="cookIng"></ul></details>
  </div>
  <div class="cook-nav"><button class="btn soft" id="cookPrev">Zurück</button><button class="btn primary" id="cookNext">Weiter</button></div>
</div>

<script src="daten.js"></script>
<script src="sync-config.js"></script>
<script src="app.js"></script>
<script src="haushalt.js"></script>
<script src="kalender.js"></script>
<script src="start.js"></script>
<script src="extras.js"></script>
</body>
</html>
